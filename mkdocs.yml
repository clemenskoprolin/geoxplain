site_name: GeoXplain
site_description: Inspect, compare, and present geospatial model explanations from any compatible backend.
strict: true
exclude_docs: |
  _tooling/
hooks:
  - docs/_tooling/hooks.py

theme:
  name: material
  language: en
  features:
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.tabs.link
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - .
            - ../geoxplain-aurora-adapter
          options:
            docstring_style: numpy
            heading_level: 2
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_root_heading: true
            show_signature_annotations: true
            show_source: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            signature_crossrefs: true

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
  - GeoXplain:
      - Visualize results: guides/visualize-results.md
      - Add weather overlays: guides/overlays.md
      - Architecture: concepts/architecture.md
      - Data model and file formats: concepts/data-model.md
      - GeoXplain Python API: reference/geoxplain.md
  - Aurora backend:
      - Overview: backends/aurora.md
      - Compute attributions: guides/compute-attributions.md
      - Attribution methods: concepts/methods.md
      - Run remotely: guides/remote-execution.md
      - Aurora adapter Python API: reference/aurora-adapter.md
      - HTTP API: reference/http-api.md
      - Command line: reference/cli.md
  - Development:
      - Documentation: development/documentation.md
